model:
  posterior_kwargs:
    activation: gelu
    batch_norm: false
    context_with_glu: false
    dropout: 0.0
    hidden_dims:
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 1024
    - 1024
    - 512
    - 128
    - 64
    - 32
    sigma_min: 0.0001
    theta_with_glu: false    # dim(x)=20, so concatenation is fine (GLU was only used for dim(x)=100)
    time_prior_exponent: 1   # 4 was tuned for Two Moons' sharp edges; LV posteriors are smooth
    type: DenseResidualNet
  type: flow_matching
task:
  name: lotka_volterra
  num_train_samples: 100000  # full run (paper: 1e3 / 1e4 / 1e5)
training:
  batch_size: 64
  early_stopping: true
  epochs: 100                # full run (early stopping may end it sooner)
  num_workers: 0
  optimizer:
    lr: 0.0002
    type: adam
  scheduler:
    factor: 0.2
    patience: 1
    type: reduce_on_plateau
  train_fraction: 0.95
